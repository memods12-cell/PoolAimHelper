
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'PoolAimHelper_source.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o PoolAimHelper_source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p PoolAimHelper assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimHelper-APK
          path: PoolAimHelper/app/build/outputs/apk/debug/*.apk
